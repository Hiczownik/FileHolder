# Dependabot keeps every pinned dependency up to date (#74). Weekly, one PR per ecosystem for all minor and patch
# updates together; each major update gets its own PR, since it may need code changes.
#
# Before merging an update of pgsty/silo (the storage server): Silo is a community fork of MinIO maintained by one
# vendor on a best-effort basis, so read its release notes first (https://github.com/pgsty/silo/releases).
version: 2

updates:
  - package-ecosystem: npm
    directory: /src/fileholder-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    # The solution, with every version in Directory.Packages.props.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # A new .NET major (11.x of these) comes with changing the target framework, done by hand.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: [version-update:semver-major]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: [version-update:semver-major]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: [version-update:semver-major]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    # The app's images, and the scanner images security.yml runs.
    directories:
      - /src/FileHolder.Api
      - /src/fileholder-ui
      - /.github/scanners/semgrep
      - /.github/scanners/gitleaks
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The .NET base images move to a new major together with the target framework, by hand.
      - dependency-name: "*dotnet/sdk"
        update-types: [version-update:semver-major]
      - dependency-name: "*dotnet/aspnet"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    # docker-compose.yml: postgres, Silo, Prometheus, Grafana. The integration tests read their images from it.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      compose-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # A new PostgreSQL major can't open the existing data volume; it needs a planned dump and restore.
      - dependency-name: "*postgres"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
