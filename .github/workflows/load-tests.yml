name: Load Tests

# The k6 scenarios (tests/load), through tests/load/run.ps1 and its checks after every run (#73). Not on every push:
# they're slow, and timings on shared runners vary. Nightly, the correctness scenarios (4, 5, 6, 9) and a short
# scenario 1 run at small scale with strict checks and generous latency limits; any scenario can be started by hand.
on:
    schedule:
        - cron: '23 2 * * *'
    workflow_dispatch:
        inputs:
            scenarios:
                description: 'Scenarios, e.g. 1,4,5,6,9 or 3 or all'
                required: true
                default: '1,4,5,6,9'
            k6_env:
                description: 'Settings for the scenarios, e.g. DURATION=5m,CLIENTS=20 (empty: each scenario''s defaults)'
                required: false
                default: ''
    # Changes to the load tests themselves run the nightly set, so the workflow and run.ps1 are tested before merging.
    pull_request:
        branches: [ "main" ]
        paths:
            - 'tests/load/**'
            - 'docker-compose.load*.yml'
            - '.github/workflows/load-tests.yml'

permissions:
    contents: read

# One run at a time: run.ps1 drives the stack under its usual project name and container names.
concurrency:
    group: load-tests-${{ github.ref }}
    cancel-in-progress: false

jobs:
    load-tests:
        name: Load Tests (k6)
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        env:
            # Pinned so compose finds the image names the bake step tags (fileholder-api, fileholder-ui).
            COMPOSE_PROJECT_NAME: fileholder
        steps:
            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Create the Compose Secrets
              run: |
                # As in ci.yml: throwaway random passwords, only on this runner.
                {
                  echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 16)"
                  echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
                  echo "STORAGE_ROOT_USER=ci-admin"
                  echo "STORAGE_ROOT_PASSWORD=$(openssl rand -hex 16)"
                  echo "STORAGE_API_SECRET_KEY=$(openssl rand -hex 16)"
                  echo "ADMIN_TOKEN=$(openssl rand -hex 32)"
                } > .env
                # The k6 container runs as its own user and writes its summaries and reports here.
                mkdir -p tests/load/results && chmod 777 tests/load/results
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Build API & UI Images (Layer-Cached)
              uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
              with:
                source: .
                files: docker-compose.yml
                targets: api,ui
                load: true
                # Reads ci.yml's layer cache; writes nothing back, so the two workflows don't evict each other's.
                set: |
                  api.tags=fileholder-api
                  ui.tags=fileholder-ui
                  api.args.GIT_SHA=${{ github.sha }}
                  ui.args.GIT_SHA=${{ github.sha }}
                  api.cache-from=type=gha,scope=api
                  ui.cache-from=type=gha,scope=ui

            # The nightly set, one scenario per step so each gets its own settings. Each runs even if one before it
            # failed, and the job fails if any did.
            - name: "Scenario 4: Download Race"
              if: github.event_name != 'workflow_dispatch'
              shell: pwsh
              run: ./tests/load/run.ps1 4 -KeepLoadConfig -HtmlReport -K6Env BURSTS=5
            - name: "Scenario 5: Password Guessing"
              if: github.event_name != 'workflow_dispatch' && !cancelled()
              shell: pwsh
              run: ./tests/load/run.ps1 5 -KeepLoadConfig -HtmlReport -K6Env BURSTS=2
            - name: "Scenario 6: Bundle Info"
              if: github.event_name != 'workflow_dispatch' && !cancelled()
              shell: pwsh
              # A tenth of the local rates for a quarter of the time; latency limits ten times the local ones.
              run: >-
                ./tests/load/run.ps1 6 -KeepLoadConfig -HtmlReport
                -K6Env DURATION=30s,KNOWN_RATE=50,UNKNOWN_RATE=150,KNOWN_P95_MS=500,UNKNOWN_P95_MS=2500
            - name: "Scenario 9: Rate Limits"
              if: github.event_name != 'workflow_dispatch' && !cancelled()
              shell: pwsh
              run: ./tests/load/run.ps1 9 -KeepLoadConfig -HtmlReport
            - name: "Scenario 1: Small Files (Short)"
              if: github.event_name != 'workflow_dispatch' && !cancelled()
              shell: pwsh
              run: ./tests/load/run.ps1 1 -KeepLoadConfig -HtmlReport -K6Env DURATION=1m,CLIENTS=5,CONFIRM_P95_MS=15000

            - name: Chosen Scenarios
              if: github.event_name == 'workflow_dispatch'
              shell: pwsh
              env:
                # Through the environment, never pasted into the script: inputs are free text.
                SCENARIOS: ${{ inputs.scenarios }}
                K6_SETTINGS: ${{ inputs.k6_env }}
              run: |
                $k6Env = @($env:K6_SETTINGS -split ',' | Where-Object { $_ })
                ./tests/load/run.ps1 ($env:SCENARIOS -split ',') -KeepLoadConfig -HtmlReport -K6Env $k6Env

            - name: Stack Logs on Failure
              if: failure()
              run: docker compose logs --no-color --tail 100 api ui postgres
            - name: Upload k6 Summaries and Reports
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                name: load-test-results
                path: tests/load/results/
                retention-days: 14
                if-no-files-found: warn
