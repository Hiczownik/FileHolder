name: FileHolder CI/CD Pipeline

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]
    
jobs:
    backend-tests:
        name: Build & Test Backend (.NET 10)
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            
            - name: Setup .NET 10 SDK
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  dotnet-version: 10.0.x
            
            - name: Restore Dependencies
              run: dotnet restore FileHolder.sln
            
            - name: Build Solution in Release Mode
              run: dotnet build FileHolder.sln --no-restore -c Release

            - name: Run Backend Unit Tests
              run: dotnet test tests/FileHolder.Tests.Unit/FileHolder.Tests.Unit.csproj -c Release --no-build --verbosity normal

            - name: Run Backend Integration Tests
              run: dotnet test tests/FileHolder.Tests.Integration/FileHolder.Tests.Integration.csproj -c Release --no-build --verbosity normal
    e2e-tests: 
        name: Build & Run Playwright E2E Tests
        runs-on: ubuntu-latest
        timeout-minutes: 40
        # No "needs": this job builds the API in Docker itself, so it runs alongside backend-tests.
        env:
            # Pinned so compose looks for the image names the bake step tags (fileholder-api, fileholder-ui).
            COMPOSE_PROJECT_NAME: fileholder

        steps:
            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            
            - name: Setup Node.js 22
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                node-version: '22'
                cache: 'npm'
                cache-dependency-path: 'src/fileholder-ui/package-lock.json'
            - name: Install Frontend Dependencies
              run: |
                cd src/fileholder-ui
                npm ci
            - name: Audit Shipped npm Packages (High and Critical Fail)
              run: |
                # Only what ends up in the built app: build and test tools never reach a browser.
                cd src/fileholder-ui
                npm audit --omit=dev --audit-level=high
            - name: Audit All npm Packages (Report Only)
              run: |
                cd src/fileholder-ui
                npm audit || echo "::warning::npm audit reports vulnerabilities in development dependencies"
            - name: Run React Component & Hook Unit Tests (Vitest)
              run: |
                cd src/fileholder-ui
                npm test
            - name: Install Playwright Browsers & System Dependencies
              # A stuck download once held this step for over 30 minutes; it normally takes 2 to 3.
              timeout-minutes: 10
              run: |
               cd src/fileholder-ui
               npx playwright install --with-deps chromium firefox webkit
            - name: Create the Compose Secrets
              run: |
                # Compose refuses to start without these (.env.example). CI never logs in anywhere, so throwaway
                # random ones are enough; .env is only on this runner.
                {
                  echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 16)"
                  echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
                  echo "STORAGE_ROOT_USER=ci-admin"
                  echo "STORAGE_ROOT_PASSWORD=$(openssl rand -hex 16)"
                  echo "STORAGE_API_SECRET_KEY=$(openssl rand -hex 16)"
                  echo "ADMIN_TOKEN=$(openssl rand -hex 32)"
                } > .env
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Build API & UI Images (Layer-Cached)
              uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
              with:
                source: .
                files: docker-compose.yml
                targets: api,ui
                load: true
                # mode=max also caches the intermediate restore/npm ci stages, not just the final images.
                # The commit goes into both builds (footer, /healthz, fileholder_build_info): the context has no .git.
                set: |
                  api.tags=fileholder-api
                  ui.tags=fileholder-ui
                  api.args.GIT_SHA=${{ github.sha }}
                  ui.args.GIT_SHA=${{ github.sha }}
                  api.cache-from=type=gha,scope=api
                  api.cache-to=type=gha,scope=api,mode=max
                  ui.cache-from=type=gha,scope=ui
                  ui.cache-to=type=gha,scope=ui,mode=max
            - name: Start Docker Compose Stack
              run: |
                # Only api, ui and tempo (plus their dependencies) are started: the tests don't use Prometheus or Grafana,
                # and tempo receives the API's traces for the trace check after the browser tests.
                # docker-compose.ci.yml raises the per-address rate limits: every test request comes from this runner.
                # Compose starts ui only once the API's health check (/healthz/ready) passes, and fails if it never does;
                # then the readiness report says which check failed.
                if ! docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build api ui tempo; then
                  echo "::error::The stack didn't start. The API's readiness report:"
                  curl -sS http://localhost:8080/healthz/ready || true
                  echo
                  docker compose logs --tail 50 api
                  exit 1
                fi
            # Image scans: high and critical vulnerabilities that have a fix fail the build. Accepted ones, each with
            # a reason and an expiry date, are in .trivyignore.
            - name: Find the Pinned Storage Image
              id: storage-image
              run: echo "ref=$(grep -m1 -oE 'pgsty/silo:[^[:space:]]+' docker-compose.yml)" >> "$GITHUB_OUTPUT"
            - name: Scan API Image (Trivy)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                version: v0.76.1
                image-ref: fileholder-api
                severity: HIGH,CRITICAL
                ignore-unfixed: true
                exit-code: '1'
                trivyignores: .trivyignore
            - name: Scan UI Image (Trivy)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                version: v0.76.1
                image-ref: fileholder-ui
                severity: HIGH,CRITICAL
                ignore-unfixed: true
                exit-code: '1'
                trivyignores: .trivyignore
            - name: Scan Storage Image (Trivy)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                version: v0.76.1
                image-ref: ${{ steps.storage-image.outputs.ref }}
                severity: HIGH,CRITICAL
                ignore-unfixed: true
                exit-code: '1'
                trivyignores: .trivyignore
            - name: Wait for API Readiness
              run: |
                # -f: a 503 (database or storage Unhealthy) counts as not ready, not just a closed port.
                # Compose has already waited on the same check before starting ui; this shows the result.
                if ! timeout 90s bash -c 'until curl -fsS http://localhost:8080/healthz/ready; do sleep 2; done'; then
                  echo "::error::The API didn't become ready within 90 s. Its last readiness report:"
                  curl -sS http://localhost:8080/healthz/ready || true
                  docker compose logs --tail 50 api
                  exit 1
                fi
            - name: Verify Storage Bucket Rejects Anonymous Access
              run: |
                # Unsigned requests must be denied. A missing key answers 403 (not 404) when the caller
                # has no read permission, so the probe object does not need to exist.
                list_status=$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:9000/fileholder-bucket/?list-type=2')
                get_status=$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:9000/fileholder-bucket/uploads/anonymous-access-probe')
                echo "Anonymous list: HTTP $list_status, anonymous get: HTTP $get_status"
                if [ "$list_status" != "403" ] || [ "$get_status" != "403" ]; then
                  echo "::error::Storage bucket allows anonymous access"
                  exit 1
                fi
            - name: Verify Storage Safety Net
              run: |
                # The API puts the lifecycle rule in place in the background just after it starts, so allow it a moment.
                mc() { docker exec fileholder-minio mc "$@"; }
                # The storage container has the admin credentials in its environment.
                docker exec fileholder-minio sh -c 'mc alias set local http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"' > /dev/null
                for attempt in $(seq 1 30); do
                  rules=$(mc ilm export local/fileholder-bucket 2>/dev/null || true)
                  echo "$rules" | grep -q '"ID":"fileholder-safety-net"' && echo "$rules" | grep -q '"Expiration":{"Days":' && break
                  sleep 2
                done
                echo "Lifecycle rules: $rules"
                if ! echo "$rules" | grep -q '"ID":"fileholder-safety-net"'; then
                  echo "::error::The storage lifecycle safety net rule is missing"
                  exit 1
                fi
                # Silo drops the rule's abort part, so its own stale-upload clean-up must be set to cover uploads.
                stale=$(mc admin config get local api --json)
                if ! echo "$stale" | grep -q '"name":"MINIO_API_STALE_UPLOADS_EXPIRY","value":"48h"'; then
                  echo "::error::MINIO_API_STALE_UPLOADS_EXPIRY is not 48h: $stale"
                  exit 1
                fi
            - name: Run Playwright E2E Tests
              run: |
                cd src/fileholder-ui
                npx playwright test
            - name: Verify Traces Reach Tempo
              run: |
                # A broken tracing setup fails nothing else: this sends one request under its own trace id and checks
                # Tempo has it, with the share token redacted (#72).
                if ! scripts/check-traces.sh; then
                  docker compose logs --tail 30 tempo
                  exit 1
                fi
            - name: Upload Playwright Artifacts on Failure
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                name: playwright-failure-report
                path: src/fileholder-ui/playwright-report/
                retention-days: 7    
            

    production-image-scans:
        # The images production runs that the dev stack doesn't (docker-compose.prod.yml), scanned like the API and
        # UI images above. Accepted findings: .trivyignore for every image, docker/trivy/<image>.trivyignore for one.
        name: Scan Production Image (${{ matrix.image }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                include:
                    # The sample keeper is built here from the UI's Dockerfile; the others are pinned in the compose file.
                    - image: sample
                    - image: caddy
                      pattern: 'caddy:'
                    # gosu only switches to the postgres user at start-up and never touches the network, so the Go
                    # library flaws Trivy finds in it can't be reached (as in scripts/pre-deploy-check.ps1).
                    - image: postgres
                      pattern: 'postgres:'
                      skip: usr/local/bin/gosu
                    - image: prometheus
                      pattern: 'prom/prometheus:'
                    - image: tempo
                      pattern: 'grafana/tempo:'
        steps:
            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Find the Image and Its Ignore Files
              id: image
              env:
                IMAGE: ${{ matrix.image }}
                PATTERN: ${{ matrix.pattern }}
              run: |
                if [ "$IMAGE" = sample ]; then
                  docker build --target sample -t fileholder-sample:ci src/fileholder-ui
                  echo "ref=fileholder-sample:ci" >> "$GITHUB_OUTPUT"
                else
                  ref=$(grep -m1 -oE "${PATTERN}[^[:space:]\"]+" docker-compose.prod.yml)
                  if [ -z "$ref" ]; then echo "::error::No ${PATTERN} image in docker-compose.prod.yml"; exit 1; fi
                  echo "ref=$ref" >> "$GITHUB_OUTPUT"
                fi
                ignores=.trivyignore
                if [ -f "docker/trivy/$IMAGE.trivyignore" ]; then ignores="$ignores,docker/trivy/$IMAGE.trivyignore"; fi
                echo "ignores=$ignores" >> "$GITHUB_OUTPUT"
            - name: Scan (Trivy)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                version: v0.76.1
                image-ref: ${{ steps.image.outputs.ref }}
                severity: HIGH,CRITICAL
                ignore-unfixed: true
                exit-code: '1'
                trivyignores: ${{ steps.image.outputs.ignores }}
                skip-files: ${{ matrix.skip }}