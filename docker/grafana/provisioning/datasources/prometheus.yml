apiVersion: 1

# Deleted and provisioned again on every start. A Grafana that first ran before the uid below was fixed keeps the
# datasource under a random uid, and provisioning then stops Grafana with "data source not found". Nothing is
# lost: the datasource is defined only here, and dashboards refer to it by this uid.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    # Fixed, so provisioned dashboards can refer to it (../dashboards).
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false