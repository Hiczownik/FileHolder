services:
  postgres:
    image: postgres:17-alpine
    container_name: fileholder-postgres
    environment:
      POSTGRES_DB: fileholder_db
      POSTGRES_USER: fileholder_user
      POSTGRES_PASSWORD: fileholder_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileholder_user -d fileholder_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: fileholder-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API Port
      - "9001:9001"   # MinIO Web Console Port
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: fileholder-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/fileholder-bucket --ignore-existing;
      /usr/bin/mc anonymous set download myminio/fileholder-bucket;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: src/FileHolder.Api/Dockerfile
    container_name: fileholder-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PostgresConnection: "Host=postgres;Port=5432;Database=fileholder_db;Username=fileholder_user;Password=fileholder_password"
      Storage__ServiceUrl: "http://minio:9000"
      Storage__PublicBaseUrl: "http://localhost:9000"
      Storage__AccessKey: "minioadmin"
      Storage__SecretKey: "minioadmin"
      Storage__BucketName: "fileholder-bucket"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  ui:
    build:
      context: ./src/fileholder-ui
      dockerfile: Dockerfile
    container_name: fileholder-ui
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data: