# Every image is pinned to an exact version and its digest, so a pull or a fresh CI runner always gets the same
# image. Dependabot proposes updates, tag and digest together (.github/dependabot.yml). The integration tests read
# the postgres and silo images from this file (ComposeImages.cs), so they always test against what runs here.
#
# No password is written here: compose reads them from a .env file next to this one, which git ignores, and refuses
# to start without them. .env.example lists them, and the README (Quick Start) has a command that generates them.
services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    container_name: fileholder-postgres
    # Time for a clean shutdown (a checkpoint) instead of crash recovery on the next start.
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: fileholder_db
      POSTGRES_USER: fileholder_user
      # Only applied when the postgres_data volume is first created; changing it later needs an ALTER USER (docs/development.md).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    # Loopback only: the API reaches Postgres over the compose network; this is just for local tooling.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileholder_user -d fileholder_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Silo: a community fork of the MinIO server (MinIO wound down its community edition), maintained by one vendor
    # on a best-effort basis, so read the release notes before taking an update. The -distroless variant can't be
    # used: it has no mc for the healthcheck the other services wait on, and runs as root just the same.
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z@sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7
    container_name: fileholder-minio
    command: server /data --console-address ":9001"
    environment:
      # The storage admin. Only minio-init and the storage console use it; the API has its own user (below).
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER:?Set STORAGE_ROOT_USER in .env (see .env.example)}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD:?Set STORAGE_ROOT_PASSWORD in .env (see .env.example)}
      MINIO_API_CORS_ALLOW_ORIGINS: "*"
      # Storage aborts multipart uploads left incomplete this long (default 24h). It must stay above the longest an
      # upload may legitimately wait for confirm, plus the purge's grace and interval: about 25.5h (UploadTimings,
      # StorageSafetyNet.CurrentMaxUnconfirmedUploadAge). This, not the lifecycle rule, is what removes abandoned
      # uploads: Silo drops the rule's AbortIncompleteMultipartUpload part.
      MINIO_API_STALE_UPLOADS_EXPIRY: "48h"
    # Bound to loopback only: browsers reach presigned URLs via localhost, nothing else needs the network.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z@sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7
    container_name: fileholder-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER:?Set STORAGE_ROOT_USER in .env (see .env.example)}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD:?Set STORAGE_ROOT_PASSWORD in .env (see .env.example)}
      STORAGE_API_SECRET_KEY: ${STORAGE_API_SECRET_KEY:?Set STORAGE_API_SECRET_KEY in .env (see .env.example)}
    volumes:
      - ./docker/silo/api-policy.json:/policies/api-policy.json:ro
    # The bucket must stay private: all access goes through presigned URLs. Setting the policy to
    # "none" explicitly also revokes public access on existing minio_data volumes.
    # The API gets its own user, limited by docker/silo/api-policy.json to what it does with this one bucket:
    # objects, multipart uploads and the safety net's lifecycle rule. Every step is safe to repeat, so a changed
    # secret or policy is applied on the next start. The integration tests use the same policy (SiloFixture).
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb myminio/fileholder-bucket --ignore-existing &&
      mc anonymous set none myminio/fileholder-bucket &&
      mc admin policy create myminio fileholder-api /policies/api-policy.json &&
      mc admin user add myminio fileholder-api \"$$STORAGE_API_SECRET_KEY\" &&
      mc admin policy attach myminio fileholder-api --user fileholder-api
      "

  api:
    build:
      context: .
      dockerfile: src/FileHolder.Api/Dockerfile
      # The build's commit and version, shown in the footer, /healthz, /api/v1/status and fileholder_build_info.
      # Docker builds have no .git, so set GIT_SHA before building (docs/operations.md, Versions and Releases):
      #   $env:GIT_SHA = git rev-parse --short HEAD; docker compose up -d --build
      # Unset, the commit shows as "unknown". VERSION only labels the image; the app's version is in the code.
      args:
        GIT_SHA: ${GIT_SHA:-}
        VERSION: ${VERSION:-dev}
    container_name: fileholder-api
    # Longer than Hosting__ShutdownTimeoutSeconds (90 by default) plus Hosting__LingerSeconds (5), so a deploy lets
    # running bundle ZIPs finish instead of Docker killing the API after its default 10 seconds.
    stop_grace_period: 100s
    # Browsers reach the API through the ui container's nginx (/api/), so it sees real client addresses.
    # This loopback port is only for local tooling and the CI health check. Metrics (9464) stay internal.
    # 9465 is the owner's admin port (maintenance modes, scripts/admin.ps1): loopback only, and never proxied.
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9465:9465"
    environment:
      # Production: Development would return internal exception messages and expose the API reference.
      ASPNETCORE_ENVIRONMENT: Production
      # Npgsql's default pool of 100 equals Postgres' max_connections, so a burst of requests (load scenario 4) left
      # the API holding every connection for the 5 minutes idle ones are kept: migrations of a second API
      # instance, psql and other tools were refused. 50 leaves room for a second instance during a rolling deploy.
      ConnectionStrings__PostgresConnection: "Host=postgres;Port=5432;Database=fileholder_db;Username=fileholder_user;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)};Maximum Pool Size=50"
      Storage__ServiceUrl: "http://minio:9000"
      # Keep in step with the ui container's STORAGE_PUBLIC_URL below.
      Storage__PublicBaseUrl: "http://localhost:9000"
      # The API's own storage user, created by minio-init (not the storage admin).
      Storage__AccessKey: "fileholder-api"
      Storage__SecretKey: ${STORAGE_API_SECRET_KEY:?Set STORAGE_API_SECRET_KEY in .env (see .env.example)}
      Storage__BucketName: "fileholder-bucket"
      # X-Forwarded-For is honoured only from the ui container's nginx, pinned to this address below.
      ForwardedHeaders__KnownProxies__0: "172.30.250.10"
      # Browsers normally call the API through nginx, same-origin, which needs no CORS. This allows the Vite dev
      # server (npm run dev, port 3000 once the ui container is stopped) to call this API on port 8080.
      Cors__AllowedOrigins__0: "http://localhost:3000"
      # Traces go to Tempo over the compose network. Not a dependency: if Tempo is down the API still serves, and
      # only traces are lost. Unset it to send none (see docs/operations.md, Tracing).
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      # The bearer token for the admin endpoints on 9465 (docs/operations.md, Maintenance Modes). At least 32 characters.
      Admin__Token: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env (see .env.example)}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Ready means the database and storage answer (/healthz/ready, see HealthEndpoints.cs). A lagging purge only
    # makes it Degraded, which still answers 200 and passes. The aspnet Alpine image has BusyBox wget, not curl;
    # wget exits non-zero on the 503 an Unhealthy check returns.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/healthz/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  ui:
    build:
      context: ./src/fileholder-ui
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
        VERSION: ${VERSION:-dev}
    container_name: fileholder-ui
    # nginx stops gracefully (SIGQUIT), waiting for the ZIPs it is passing on from the API; as long as the API waits.
    stop_grace_period: 100s
    ports:
      - "3000:80"
    environment:
      # The same address as the API's Storage__PublicBaseUrl. The page's Content-Security-Policy lets it upload to
      # and download from this address only, so with a different one every transfer is blocked.
      STORAGE_PUBLIC_URL: "http://localhost:9000"
      # Browsers connect to nginx directly here, so no forwarded header is trusted. Behind a reverse proxy, list its
      # address (docker-compose.prod.yml sets Caddy's), so nginx and the API see real client addresses.
      TRUSTED_PROXIES: ""
    networks:
      default:
        # Fixed so the API can trust X-Forwarded-For from this container and nothing else.
        ipv4_address: 172.30.250.10
    depends_on:
      # Started once the API is ready, so the page never loads against an API that can't serve it.
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: fileholder-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      # Kept across restarts, and across the recreation that switching to and from docker-compose.load.yml causes,
      # so a load run's metrics can still be looked at afterwards.
      - prometheus_data:/prometheus
    depends_on:
      - api

  tempo:
    # Traces (docker/tempo/tempo.yaml): kept 48 h. OTLP (4317 gRPC, 4318 HTTP) is only reachable on the compose
    # network; the query port is on loopback for scripts/check-traces.sh and local tooling. Grafana reads it as the
    # Tempo datasource.
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    container_name: fileholder-tempo
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: fileholder-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD (e.g. in a .env file next to docker-compose.yml)}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - tempo

  # Load tests (tests/load). Only started on demand: the "load" profile keeps `docker compose up` from running it.
  # Use tests/load/run.ps1, which also applies docker-compose.load.yml so presigned URLs point at minio:9000.
  k6:
    image: grafana/k6:2.3.0@sha256:2dd4756ec6e14e62778916e1eb850108e4b499304c02df56760fa0bdb0fba0b8
    profiles: ["load"]
    environment:
      # Through nginx, as browsers reach the API, so the API sees the k6 container's address as the client.
      FILEHOLDER_URL: "http://ui"
      PROMETHEUS_URL: "http://prometheus:9090"
      # For `-o experimental-prometheus-rw` (run.ps1): k6's metrics next to the API's own, in the same Prometheus.
      K6_PROMETHEUS_RW_SERVER_URL: "http://prometheus:9090/api/v1/write"
      K6_PROMETHEUS_RW_TREND_STATS: "p(50),p(95),p(99),max"
    volumes:
      - ./tests/load:/scripts:ro
      - ./tests/load/results:/results
    depends_on:
      - ui

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  tempo_data:

networks:
  default:
    # Pinned so the ui container can have a fixed address (see ForwardedHeaders__KnownProxies__0).
    # If this range clashes with a network on your machine, change it here and in both places above.
    ipam:
      config:
        - subnet: 172.30.250.0/24
