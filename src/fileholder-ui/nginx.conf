server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # The API is reached through this proxy rather than its own published port, so it sees each client's
    # address in X-Forwarded-For instead of one shared address, and per-client rate limits work.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # Overwrite, never append: a client-supplied X-Forwarded-For would let anyone pick their own
        # rate-limit partition. The API trusts this header only from this container's address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Requests are small JSON bodies; file contents go straight to storage via presigned URLs.
        client_max_body_size 1m;

        # Stream bundle ZIPs to the client as they are built instead of buffering them here.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Gzip Compression for fast asset delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
